name: Build Football Predictor APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p /tmp/fp-source
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android ZIP archive not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d /tmp/fp-source

          PROJECT_DIR=$(dirname "$(find /tmp/fp-source -name settings.gradle.kts -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project structure is incorrect"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballPredictorAI-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
